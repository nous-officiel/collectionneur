services:
  db:
    image: postgres:16-alpine
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-utilisateur}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile.dev
    ports:
      - '8000:8000'
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
