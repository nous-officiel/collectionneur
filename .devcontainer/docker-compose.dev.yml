services:
  db:
    image: postgres:16-alpine
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-utilisateur}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile.dev
    expose:
      - 8000
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - app-network

  proxy_authentification:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    ports:
      - "8000:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: azure gp
      OAUTH2_PROXY_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET}"
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:8000/oauth2/callback
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://login.microsoftonline.com/df424770-d48a-41aa-b4dd-733812cc7fab/v2.0
      OAUTH2_PROXY_COOKIE_SECURE: false
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_UPSTREAMS: http://app:1880/
      # 0.0.0.0 est important https://community.traefik.io/t/error-calling-http-oauth2-proxy-4180/20025
      OAUTH2_PROXY_HTTP_ADDRESS: '0.0.0.0:8000'
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: true

volumes:
  postgres_data:

networks:
  app-network:
